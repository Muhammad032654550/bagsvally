<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin</title>
<link rel="stylesheet" href="../css/style.css?v=202610270038"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"></head><body>
<div id="login" class="box" style="max-width:380px;margin:14vh auto" hidden><h2>Enter access code</h2><form id="lf"><label for="pw">Access code</label><input id="pw" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="10" required><p id="le" role="alert" style="color:#a01048;min-height:24px"></p><button class="btn" style="width:100%">Unlock</button></form></div>
<div id="app" class="adm" hidden><nav class="side" id="sd" aria-label="Admin"></nav><div class="main" id="pn"></div></div>
<dialog id="pf"><button class="x" data-close aria-label="Close">&times;</button><h2 id="pt2">Product</h2><form id="pform">
<label for="a1">Name</label><input id="a1" required><div class="f2"><div><label for="a2">Category</label><select id="a2"></select></div><div><label for="a0">Page address (slug)</label><input id="a0" placeholder="auto from name"></div><div><label for="a3">Price (PKR)</label><input id="a3" type="number" min="0" step="1" required></div><div><label for="a4">Sale price (0 = none)</label><input id="a4" type="number" min="0" step="1" value="0"></div><div><label for="a5">Stock</label><input id="a5" type="number" min="0" value="10"></div><div><label for="a6">Color (used when no photo)</label><input id="a6" type="color" value="#ff5fa2"></div></div>
<label for="a7">Description</label><textarea id="a7" rows="3"></textarea><label for="d1">Details, one per line</label><textarea id="d1" rows="3"></textarea>
<div class="imgf"><span class="lb">Photos (first one is the main photo)</span><div id="pslots" style="display:flex;gap:12px;flex-wrap:wrap"></div></div>
<label style="font-weight:400"><input type="checkbox" id="a9" style="width:auto;min-height:0"> Photo has a white background</label><label style="font-weight:400"><input type="checkbox" id="b1" style="width:auto;min-height:0"> Show Best seller badge</label><label style="font-weight:400"><input type="checkbox" id="b2" style="width:auto;min-height:0"> Hide from store</label>
<label for="s1">Google title for this product (optional)</label><input id="s1"><label for="s2">Google description for this product (optional)</label><textarea id="s2" rows="2"></textarea><p></p><button class="btn">Save and publish</button></form></dialog>
<dialog id="cdl"><button class="x" data-close aria-label="Close">&times;</button><h2 id="cdt">Delete category</h2><p id="cdp"></p><div id="cdo"></div><p></p><button class="btn" id="cdgo">Delete category</button></dialog>
<div id="ts" role="status" hidden></div><script src="admin.js?v=202610270038"></script></body></html>
